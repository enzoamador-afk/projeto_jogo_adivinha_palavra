<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo de adivinhar palavra</title>
</head>
<body>

    <h1 id="tituloP">Palavra: 0</h1>
        
    <form action="" id="form-enviar">
        <input type="password" id="palavraDigitada" name="palavraDigita" placeholder="Digite a palavra secreta..." required> 
        <button id="btnEnviarSecreta">Enviar</button>
    </form>
    

    <h2 id="mostrarPalavraSecreta"></h2>

     <div class="controle-resposta">
      <input type="text" id="input-palavra" placeholder="Digite sua resposta..." />
      <button>Responder</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
